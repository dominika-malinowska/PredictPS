[tool.poetry]
name = "predictps"
version = "1.0.0"
description = "Pixel-wise PS density prediction from global coherence rasters and OSM infrastructure maps."
authors = ["Dominika Malinowska <dominika.u.malinowska@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dominika-malinowska/PredictPS"
repository = "https://github.com/dominika-malinowska/PredictPS"
keywords = [
    "InSAR",
    "persistent scatterer",
    "coherence",
    "Sentinel-1",
    "infrastructure monitoring",
    "PS density",
]
packages = [{ include = "ps_density", from = "src" }]

[tool.poetry.dependencies]
python = "~3.9.18"
Cartopy = "0.22.0"
geocube = "0.4.2"
geopandas = "0.14.3"
huggingface-hub = "1.8.0"
kornia = "0.7.1"
lightning = "2.2.0.post0"
matplotlib = "3.8.2"
numpy = "1.26.3"
osmium = "3.7.0"
pandas = "2.2.0"
pillow = "10.2.0"
pyproj = "3.6.1"
pyyaml = "^6.0"
rasterio = "1.3.9"
rioxarray = "0.15.0"
seaborn = "0.13.2"
segmentation_models_pytorch = "0.3.3"
setuptools = "68.2.2"
shapely = "2.0.3"
timm = "0.9.2"
torchgeo = "0.5.2"
torchmetrics = "1.3.1"
torch = { url = "https://download.pytorch.org/whl/cu118/torch-2.0.1%2Bcu118-cp39-cp39-linux_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu118/torchvision-0.15.2%2Bcu118-cp39-cp39-linux_x86_64.whl" }
mpl-scatter-density = "^0.8"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

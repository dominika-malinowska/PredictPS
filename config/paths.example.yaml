# Copy to paths.yaml and set data_root to the directory that holds rasters
# and checkpoints (this can be the repo data/ folder or any other path):
#   cp config/paths.example.yaml config/paths.yaml
#
# Or set only the root via environment variable:
#   export PREDICTPS_DATA_ROOT=/path/to/data
#
# Custom config file:
#   export PREDICTPS_PATHS_FILE=/path/to/my_paths.yaml
#
# TorchGeo reads one GeoTIFF or every *.tif in a directory. Coherence must be
# the tiles/ directory of 1x1 degree files. random_bbox_splitting cuts 70/15/15
# from each file, which is the paper split. One mosaicked coherence raster is a
# single file, so the same fractions cover different ground and the test MAE
# changes. OSM and the EGMS mask stay one file each. Train and test share them.
#
# Fill only the block you need: prepare, train, test, predict, or paper.

data_root: /path/to/data

# -------------------------------------------------------------------------
# prepare — ps_density.prepare_data.prepare_coherence, prepare_osm,
#           and prepare_egms.ipynb
# -------------------------------------------------------------------------
prepare:
  aoi_lon: [3, 8]   # longitude extent to cover; 1x1 tiles are derived from this
  aoi_lat: [50, 54]  # latitude extent to cover
  exclude_tiles: []  # optional south-west corners to skip, e.g. - [7, 51]
  # One .osm.pbf, or a directory of them. prepare_osm.py clips every file in
  # the directory together for each tile. Not fetched by the script. Published
  # training data used Geofabrik builds from 2023-10-26; a newer extract is fine,
  # but it could result in slightly different geometries and therefore different
  # infrastructure map and training results.
  osm_pbf: "{data_root}/input/OSM/osm_source"
  # URL list downloaded from the EGMS website after drawing an AOI
  # (https://egms.land.copernicus.eu/... zip links). prepare_egms.ipynb
  # filters it by orbit and writes *_filtered.txt next to this file.
  egms_links_txt: "{data_root}/input/EGMS/egms-archive-links_example.txt"
  # Unzipped EGMS L2b shapefiles after the manual download. The notebook
  # merges *_partN.shp here; QGIS then writes the density GeoTIFF to
  # train.input.mask_egms.
  egms_shp_dir: "{data_root}/input/egms/shp"

# -------------------------------------------------------------------------
# train — ps_density.pipeline.train and pipeline/notebooks/train.ipynb
# -------------------------------------------------------------------------
train:
  input:
    coherence_summer: &nl_coh "{data_root}/input/coherence_summer_NL/summer_vv_rho/tiles/"  # 1x1 tiles; TorchGeo splits each file
    osm: &nl_osm "{data_root}/input/OSM/OSM_combined.tif"  # merged OSM infrastructure
    mask_egms: &nl_mask "{data_root}/input/EGMS/egms_point_density.tif"  # EGMS PS-density raster
  output:
    results_dir: "{data_root}/results_train"  # checkpoints and TensorBoard logs

# -------------------------------------------------------------------------
# test — ps_density.pipeline.test_predict and pipeline/notebooks/test_predict.ipynb
# -------------------------------------------------------------------------
test:
  input:
    coherence_summer: *nl_coh
    osm: *nl_osm
    mask_egms: *nl_mask
    google_satellite_dir: "{data_root}/input/google_satellite"  # RGB context for review plots
  # Leave checkpoint null/empty to download the 2-channel paper model from Hugging Face
  # (dominika-malinowska/ps_predictions, seed_54321_20231214-203338.ckpt).
  # Set a local .ckpt (for example a training run) to override.
  checkpoint: null
  checkpoints:
    one_channel: "{data_root}/input/nn_models/one_input_channel/seed_54321_20231218-105437.ckpt"  # 1-channel comparison (Zenodo; not on Hugging Face)
  output:
    results_dir: "{data_root}/results_test"
    plots_dir: "{data_root}/results_test/plots"
  rome:
    coherence_dir: "{data_root}/input_Italy/coh_Rome_cropped"
    osm_dir: "{data_root}/input_Italy/OSM_Rome_combined/Rome_combined.tif"
    mask_dir: "{data_root}/input_Italy/EGMS_mask_Rome/egms_point_density_Rome.tif"
    google_satellite_dir: "{data_root}/input_Italy/Google_satellite_Rome"
    results_dir: "{data_root}/results_test_rome"
    plots_dir: "{data_root}/results_test_rome/plots"

# -------------------------------------------------------------------------
# predict — ps_density.pipeline.predict_region and pipeline/notebooks/predict_region.ipynb
# The area of interest must sit inside one 1x1 degree coherence tile.
# -------------------------------------------------------------------------
predict:
  osmconvert: osmconvert  # binary on PATH, or an absolute path
  aoi_lon: [18.53, 18.9]
  aoi_lat: [50.05, 50.5]
  # Geofabrik regional .pbf; not downloaded by the script
  osm_pbf: "{data_root}/input_predict_region/OSM/slaskie-latest.osm.pbf"
  # Leave checkpoint null/empty to download the 2-channel paper model from Hugging Face
  # (dominika-malinowska/ps_predictions, seed_54321_20231214-203338.ckpt).
  # Set a local .ckpt (for example a training run) to override.
  checkpoint: null
  output:
    results_dir: "{data_root}/results_predict_region"

# -------------------------------------------------------------------------
# paper — ps_density.pipeline.data_analysis_for_the_paper only.
# Coherence keys are mosaic GeoTIFFs (not the train tiles/ directory).
# Summer usually comes from prepare_coherence. Spring/fall/winter mosaics
# are downloaded by the paper script if missing (same prepare.aoi_*).
# -------------------------------------------------------------------------
paper:
  plots_dir: "{data_root}/results_paper"
  input:
    coherence_summer: "{data_root}/input/coherence_summer_NL/summer_vv_rho/summer_vv_rho.tif"
    coherence_spring: "{data_root}/input_plots/coherence_spring_NL/spring_vv_rho/spring_vv_rho.tif"
    coherence_fall: "{data_root}/input_plots/coherence_fall_NL/fall_vv_rho/fall_vv_rho.tif"
    coherence_winter: "{data_root}/input_plots/coherence_winter_NL/winter_vv_rho/winter_vv_rho.tif"
    mask_egms: "{data_root}/input/EGMS/egms_point_density.tif"
    ndvi_winter: "{data_root}/input/NDVI/mean_ndvi_S2_wi_nan_filled_resized.tif"
    ndvi_summer: "{data_root}/input/NDVI/mean_ndvi_S2_su_nan_filled_resized.tif"
    ndvi_winter_std: "{data_root}/input/NDVI/std_ndvi_S2_wi_nan_filled_resized.tif"
    ndvi_summer_std: "{data_root}/input/NDVI/std_ndvi_S2_su_nan_filled_resized.tif"
    osm: "{data_root}/input/OSM/OSM_combined.tif"
    osm_buildings: "{data_root}/input/OSM/separate/buildings.tif"
    osm_railway: "{data_root}/input/OSM/separate/railway.tif"
    osm_highway: "{data_root}/input/OSM/separate/highway.tif"
    osm_motorway: "{data_root}/input/OSM/separate/highway_motorway.tif"
    osm_trunk: "{data_root}/input/OSM/separate/highway_trunk.tif"
    osm_primary: "{data_root}/input/OSM/separate/highway_primary.tif"
    osm_secondary: "{data_root}/input/OSM/separate/highway_secondary.tif"
    pred_nl: "{data_root}/results_test/merged_prediction_NL.tif"
    pred_rome: "{data_root}/results_test_rome/merged_prediction_Rome.tif"
    rome_mask: "{data_root}/input_Italy/EGMS_mask_Rome/egms_point_density_Rome.tif"
    egms_plots_dir: "{data_root}/EGMS_data_for_paper_plots"

# Copy to paths.yaml and set data_root to the directory that holds rasters
# and checkpoints (this can be the repo data/ folder or any other path):
#   cp config/paths.example.yaml config/paths.yaml
#
# Or set only the root via environment variable:
#   export PREDICTPS_DATA_ROOT=/path/to/data
#
# Custom config file:
#   export PREDICTPS_PATHS_FILE=/path/to/my_paths.yaml
#
# Torchgeo accepts one GeoTIFF or a directory of them. Coherence, OSM, and the
# EGMS mask below are the merged files. Per-tile rasters written under tiles/
# next to those files are not read. Train and test use the same three files.
#
# Fill only the block you need: prepare, train, test, predict, or paper.

data_root: /path/to/data

# -------------------------------------------------------------------------
# prepare — scripts/prepare_data/prepare_coherence.py, prepare_osm.py,
#           and prepare_egms.ipynb
# -------------------------------------------------------------------------
prepare:
  aoi_lon: [3, 8]   # longitude extent to cover; 1x1 tiles are derived from this
  aoi_lat: [50, 54]  # latitude extent to cover
  exclude_tiles:     # optional south-west corners of 1x1 tiles to skip
    - [7, 51]
  # One .osm.pbf, or a directory of them (every *.osm.pbf is clipped together
  # per tile). Not fetched by prepare_osm.py. Published training data used
  # Geofabrik builds from 2023-10-26; a newer extract is fine.
  osm_pbf: "{data_root}/input/OSM/osm_source"
  # URL list downloaded from the EGMS website after drawing an AOI
  # (https://egms.land.copernicus.eu/... zip links). prepare_egms.ipynb
  # filters it by orbit and writes *_filtered.txt next to this file.
  egms_links_txt: "{data_root}/input/egms/egms-archive-links.txt"
  # Unzipped EGMS L2b shapefiles after the manual download. The notebook
  # merges *_partN.shp here; QGIS then writes the density GeoTIFF to
  # train.input.mask_egms.
  egms_shp_dir: "{data_root}/input/egms/shp"

# -------------------------------------------------------------------------
# train — scripts/train.py and notebooks/train.ipynb
# -------------------------------------------------------------------------
train:
  input:
    coherence_summer: &nl_coh "{data_root}/input/global_coh_NL/summer_vv_rho/summer_vv_rho.tif"  # merged summer VV rho
    osm: &nl_osm "{data_root}/input/OSM_input_updated/OSM_combined.tif"  # merged OSM infrastructure
    mask_egms: &nl_mask "{data_root}/input/mask/mask_EGMS/egms_point_denisty.tif"  # EGMS PS-density raster
  output:
    training_dir: "{data_root}/trainingnn_results"  # checkpoints and TensorBoard logs
    experiment_name: pixel_wise_regression_model_training_updated_OSM

# -------------------------------------------------------------------------
# test — scripts/test_predict.py and notebooks/test_predict.ipynb
# -------------------------------------------------------------------------
test:
  input:
    coherence_summer: *nl_coh
    osm: *nl_osm
    mask_egms: *nl_mask
    google_satellite_dir: "{data_root}/input/Google_satellite"  # optional RGB context for plots
  checkpoints:
    netherlands_20231214: "{data_root}/best_models_15122023/seed_54321_20231214-203338.ckpt"  # loaded then replaced
    netherlands_updated_osm: "{data_root}/trainingnn_results/pixel_wise_regression_model_training_updated_OSM/seed_54321_20240612-132349.ckpt"
    one_channel_20231218: "{data_root}/best_models_1in_18122023/seed_54321_20231218-105437.ckpt"  # one-channel comparison
  output:
    revision_results_dir: "{data_root}/trainingnn_results_paper_revisions"
    experiment_name: pixel_wise_regression_model_training
    plots_review_dir: "{data_root}/plots_review"
  rome:
    coherence_dir: "{data_root}/input/Italy/coh_Rome_cropped"
    osm_dir: "{data_root}/input/Italy/OSM_Rome_combined"
    mask_dir: "{data_root}/input/Italy/SNT/msk"
    google_satellite_dir: "{data_root}/input/Italy/Google_satellite"
    plots_review_dir: "{data_root}/plots_review_Rome"

# -------------------------------------------------------------------------
# predict — scripts/predict_region.py and notebooks/predict_region.ipynb
# The area of interest must sit inside one 1x1 degree coherence tile.
# -------------------------------------------------------------------------
predict:
  osmconvert: osmconvert  # binary on PATH, or an absolute path
  aoi_lon: [18.53, 18.9]
  aoi_lat: [50.05, 50.5]
  # Geofabrik regional .pbf in the experiment dir; not downloaded by the script
  osm_pbf_name: slaskie-latest.osm.pbf
  checkpoint: "{data_root}/best_models_15122023/seed_54321_20231214-203338.ckpt"
  output:
    revision_results_dir: "{data_root}/trainingnn_results_paper_revisions"
    experiment_name: pixel_wise_regression_run_predictions

# -------------------------------------------------------------------------
# paper — scripts/data_analysis_for_the_first_paper.py only
# -------------------------------------------------------------------------
paper:
  plots_dir: "{data_root}/plots_paper_final_version"
